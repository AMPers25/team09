<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경보·주의보 달력</title>
    <link rel="stylesheet" href="../assets/css/calendar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!-- 상단 네비게이션 바 -->
    <div class="top-nav">
        <div class="nav-left">
            <button class="home-btn" aria-label="홈으로 이동"><i class="fa-solid fa-house"></i></button>
            <select id="regionSelector" class="region-selector" aria-label="지역 선택"></select>
            <button id="regionGoBtn" class="region-go-btn" type="button">이동</button>
        </div>
        <div class="nav-right">
            <button class="nav-tab" data-tab="temperature">기온</button>
            <button class="nav-tab" data-tab="precipitation">강수량</button>
            <button class="nav-tab active" data-tab="alerts">경보특보</button>
        </div>
    </div>

    <!-- 메인 콘텐츠 -->
    <div class="main-content">
        <!-- 달력 영역 -->
        <div class="calendar-container">
            <div class="secondary-nav">
                <div class="calendar-controls">
                    <span class="year-display">2024년</span>
                    <button id="prevMonthBtn" class="nav-arrow" type="button" aria-label="이전 달" onclick="changeMonth(-1)">‹</button>

                    <!-- API 연결 이후 -->
                    <!-- 아래의 디폴트 값 없애기 -->

                    <span class="month-display" id="currentMonthDisplay">9월</span>
                    <button id="nextMonthBtn" class="nav-arrow" type="button" aria-label="다음 달" onclick="changeMonth(1)">›</button>
                </div>
            </div>
            <div class="calendar-content calendar-content--single">
                <div class="calendar-main">
                    <div class="day-headers" id="dayHeaders"></div>
                    <div class="days-grid" id="daysGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 서버에서 JSON을 주입할 수 있는 영역 -->
    <!--
    <script id="embeddedAlertCalendarData" type="application/json">
        { ... }
    </script>
    -->

    <script>
        const FIXED_YEAR = 2024;

        const WEATHER_ICON_MAP = {
            '맑음': './icons/clear.png',
            '구름 조금': './icons/partly_cloudy.png',
            '구름 많음': './icons/mostly_cloudy.png',
            '흐림': './icons/overcast.png',
            '비': './icons/rain.png',
            '눈': './icons/snow.png'
        };


        const ALERT_GROUP_MAP = {
            '대설주의보': '대설',
            '대설경보': '대설',
            '한파주의보': '한파',
            '한파경보': '한파',
            '강풍주의보': '강풍',
            '강풍경보': '강풍',
            '풍랑주의보': '강풍',
            '풍랑경보': '강풍',
            '건조주의보': '건조',
            '건조경보': '건조',
            '호우주의보': '호우',
            '호우경보': '호우',
            '폭염주의보': '폭염',
            '폭염경보': '폭염',
            '폭풍해일주의보': '폭풍해일',
            '폭풍해일경보': '폭풍해일',
            '태풍주의보': '폭풍해일',
            '태풍경보': '폭풍해일'
        };

        const ALERT_ICON_MAP = {
            '대설': './icons/대설.png',
            '한파': './icons/한파.png',
            '강풍': './icons/강풍.png',
            '건조': './icons/건조.png',
            '호우': './icons/호우.png',
            '폭염': './icons/폭염.png',
            '폭풍해일': './icons/폭풍해일.png'
        };

        // URL 파라미터에서 region_code와 month 읽기
        const urlParams = new URLSearchParams(window.location.search);
        const regionCode = urlParams.get('region_code') || urlParams.get('region') || '';
        const monthParam = urlParams.get('month');
        const initialMonth = monthParam ? parseInt(monthParam, 10) - 1 : new Date().getMonth();
        
        // region_code가 필수이므로 없으면 에러
        if (!regionCode) {
            throw new Error('region_code 파라미터가 필요합니다. 캘린더를 표시하려면 지역 코드를 제공해야 합니다.');
        }
        
        let currentDate = new Date(FIXED_YEAR, initialMonth, 1);
        let calendarData = null;
        let currentTab = 'alerts';
        let activeDayCell = null;

        document.addEventListener('DOMContentLoaded', async () => {
            updateMonthDisplay(); // 초기 로드 시 버튼 상태 업데이트
            setupTabHandlers();
            setupHomeButton();
            await loadCalendarData();
            setupRegionSelector();
        });

        function setupHomeButton() {
            const homeBtn = document.querySelector('.home-btn');
            if (homeBtn) {
                homeBtn.addEventListener('click', () => {
                    window.location.href = '/team09/pages/index.html';
                });
            }
        }

        async function setupRegionSelector() {
            const selector = document.getElementById('regionSelector');
            const goBtn = document.getElementById('regionGoBtn');
            if (!selector || !goBtn) return;

            try {
                const response = await fetch('/team09/api/ranking?limit=100', {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`API 응답 오류: ${response.status}`);
                }

                const responseData = await response.json();
                const regions = responseData.data || responseData || [];

                selector.innerHTML = regions
                    .map(region => `<option value="${region.region_code}">${region.region_name}</option>`)
                    .join('');

                if (regionCode) {
                    selector.value = regionCode;
                }

                goBtn.addEventListener('click', () => {
                    const selectedCode = selector.value;
                    if (!selectedCode) return;

                    const month = currentDate.getMonth() + 1;
                    const params = new URLSearchParams();
                    params.set('region_code', selectedCode);
                    params.set('month', String(month).padStart(2, '0'));
                    window.location.href = `alert-calendar.html?${params.toString()}`;
                });
            } catch (error) {
                console.error('지역 목록 로드 실패:', error);
            }
        }

        function setupTabHandlers() {
            const tabs = document.querySelectorAll('.nav-tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', function () {
                    const targetTab = this.dataset.tab;
                    
                    // 현재 region_code와 month 유지하면서 해당 캘린더로 이동
                    const month = currentDate.getMonth() + 1;
                    const params = new URLSearchParams();
                    params.set('region_code', regionCode);
                    params.set('month', String(month).padStart(2, '0'));
                    
                    let targetPage = '';
                    if (targetTab === 'temperature') {
                        targetPage = 'temp-calendar.html';
                    } else if (targetTab === 'precipitation') {
                        targetPage = 'rain-calendar.html';
                    } else if (targetTab === 'alerts') {
                        targetPage = 'alert-calendar.html';
                    }
                    
                    const currentPage = window.location.pathname.split('/').pop() || '';
                    if (targetPage && targetPage !== currentPage) {
                        window.location.href = `${targetPage}?${params.toString()}`;
                    } else {
                        // 같은 페이지면 탭만 변경
                        tabs.forEach(t => t.classList.remove('active'));
                        this.classList.add('active');
                        currentTab = targetTab;
                    }
                });
            });
        }

        function changeMonth(direction) {
            const currentMonth = currentDate.getMonth();
            let newMonth = currentMonth + direction;

            // 1월에서 이전 달로 가거나 12월에서 다음 달로 가는 것을 방지
            if (newMonth < 0 || newMonth > 11) {
                return;
            }

            currentDate = new Date(FIXED_YEAR, newMonth, 1);
            
            // URL 업데이트
            const month = newMonth + 1;
            const params = new URLSearchParams();
            params.set('region_code', regionCode);
            params.set('month', String(month).padStart(2, '0'));
            window.history.replaceState({}, '', `${window.location.pathname}?${params.toString()}`);
            
            loadCalendarData();
            updateMonthDisplay();
        }

        function updateMonthDisplay() {
            const month = currentDate.getMonth() + 1;
            document.getElementById('currentMonthDisplay').textContent = `${month}월`;
            
            // 월에 따라 버튼 표시/숨김
            const prevBtn = document.getElementById('prevMonthBtn');
            const nextBtn = document.getElementById('nextMonthBtn');
            
            if (prevBtn) {
                prevBtn.style.display = month === 1 ? 'none' : 'block';
            }
            if (nextBtn) {
                nextBtn.style.display = month === 12 ? 'none' : 'block';
            }
        }

        async function loadCalendarData() {
            const year = FIXED_YEAR;
            const month = currentDate.getMonth() + 1;

            try {
                const apiUrl = `/team09/api/calendar/alert/${regionCode}/2024/${month}`;
                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`API 응답 오류: ${response.status}`);
                }

                const responseData = await response.json();
                const apiData = responseData.data || responseData;
                
                console.log('API 응답 데이터:', apiData);
                console.log('첫 번째 항목:', apiData[0]);
                
                calendarData = transformToCalendarFormat(apiData, year, month);
                console.log('변환된 캘린더 데이터:', calendarData);
                renderCalendar();
            } catch (error) {
                console.error('API 호출 실패:', error);
                document.body.innerHTML = `<div style="padding: 20px; text-align: center;">
                    <h2>데이터를 불러올 수 없습니다</h2>
                    <p>${error.message}</p>
                    <p>브라우저 콘솔을 확인하세요.</p>
                </div>`;
            }
        }

        function transformToCalendarFormat(apiData, year, month) {
            const days = [];
            const alertsByDate = new Map();
            const weatherCodeByDate = new Map();
            const weatherNameByDate = new Map();
            const holidayByDate = new Map();

            // API 응답에서 날짜별로 경보 데이터, 날씨 정보, 공휴일 정보 그룹화
            apiData.forEach(item => {
                if (!item.date_id) return;
                
                const dateParts = item.date_id.split('-');
                const itemYear = parseInt(dateParts[0], 10);
                const itemMonth = parseInt(dateParts[1], 10);
                const day = parseInt(dateParts[2], 10);

                // 해당 월의 날짜만 포함
                if (itemYear !== year || itemMonth !== month) {
                    return;
                }

                // 경보 정보 저장 (alert_id가 있는 경우만)
                if (item.alert_id) {
                    if (!alertsByDate.has(day)) {
                        alertsByDate.set(day, []);
                    }
                    alertsByDate.get(day).push(item.alert_type);
                }

                // 날씨 코드 저장 (같은 날짜에 여러 항목이 있을 수 있으므로 첫 번째 것만 사용)
                if (!weatherCodeByDate.has(day) && item.status_code) {
                    weatherCodeByDate.set(day, item.status_code);
                }

                // 날씨 이름 저장 (같은 날짜에 여러 항목이 있을 수 있으므로 첫 번째 것만 사용)
                if (!weatherNameByDate.has(day) && item.status_name) {
                    weatherNameByDate.set(day, item.status_name);
                }

                // 공휴일 정보 저장
                if (!holidayByDate.has(day) && item.is_holiday !== undefined) {
                    holidayByDate.set(day, item.is_holiday == 1 || item.is_holiday === true);
                }
            });

            // 해당 월의 모든 날짜 생성
            const lastDay = new Date(year, month, 0).getDate();
            for (let day = 1; day <= lastDay; day++) {
                const alerts = alertsByDate.get(day) || [];
                const alertType = alerts.length > 0 ? alerts[0] : null; // 첫 번째 경보 타입 사용
                const weatherCode = weatherCodeByDate.get(day) || null; // 날씨 코드
                const weatherName = weatherNameByDate.get(day) || null; // 날씨 정보가 없으면 기본값
                const isHoliday = holidayByDate.has(day) 
                    ? holidayByDate.get(day) 
                    : (new Date(year, month - 1, day).getDay() === 0 || new Date(year, month - 1, day).getDay() === 6); // DB 정보가 없으면 주말 체크

                days.push({
                    day: day,
                    alertType: alertType,
                    isHoliday: isHoliday,
                    weatherCode: weatherCode,
                    weather: weatherName
                });
            }

            return {
                year: year,
                month: month,
                region_code: regionCode,
                region_name: null, // API에서 region_name을 제공하지 않으므로 null
                days: days
            };
        }

        function buildWeeks(days, year, month) {
            const firstDay = new Date(year, month - 1, 1);
            const startOffset = (firstDay.getDay() + 6) % 7;
            const weeks = [];
            let currentWeek = [];

            for (let i = 0; i < startOffset; i++) {
                currentWeek.push(null);
            }

            days.forEach(day => {
                currentWeek.push(day);
                if (currentWeek.length === 7) {
                    weeks.push(currentWeek);
                    currentWeek = [];
                }
            });

            if (currentWeek.length > 0) {
                while (currentWeek.length < 7) {
                    currentWeek.push(null);
                }
                weeks.push(currentWeek);
            }

            return weeks;
        }

        function formatDateToISO(year, month, day) {
            const normalizedMonth = String(month).padStart(2, '0');
            const normalizedDay = String(day).padStart(2, '0');
            return `${year}-${normalizedMonth}-${normalizedDay}`;
        }

        function handleDaySelection(dayData, context) {
            const { region_code, year, month } = context;
            if (!region_code || !dayData || !dayData.day) {
                console.error('필수 파라미터가 없습니다.');
                return;
            }

            const dateParam = formatDateToISO(year, month, dayData.day);
            const params = new URLSearchParams({
                region_code: region_code,
                date: dateParam
            });
            
            window.location.href = `day-info.html?${params.toString()}`;
        }

        function renderCalendar() {
            if (!calendarData) return;

            const year = calendarData.year;
            const month = calendarData.month;
            const regionCodeForContext = calendarData.region_code || regionCode;

            updateMonthDisplay();

            const dayHeadersContainer = document.getElementById('dayHeaders');
            const daysGrid = document.getElementById('daysGrid');

            dayHeadersContainer.innerHTML = '';
            daysGrid.innerHTML = '';

            ['월', '화', '수', '목', '금', '토', '일'].forEach(day => {
                const headerCell = document.createElement('div');
                headerCell.className = 'day-header';
                headerCell.textContent = day;
                dayHeadersContainer.appendChild(headerCell);
            });

            const weeks = buildWeeks(calendarData.days, year, month);

            weeks.forEach(week => {
                week.forEach(dayData => {
                    const dayCell = document.createElement('div');
                    dayCell.className = 'day-cell';

                    if (!dayData) {
                        dayCell.classList.add('empty');
                        daysGrid.appendChild(dayCell);
                        return;
                    }

                    dayCell.classList.add('clickable');

                    if (dayData.isHoliday) {
                        dayCell.classList.add('holiday');
                    }

                    const alertGroup = dayData.alertType ? ALERT_GROUP_MAP[dayData.alertType] : null;
                    
                    // alert가 있으면 alert 아이콘과 텍스트, 없으면 weather 아이콘과 텍스트
                    let iconSrc, iconAlt, textContent;
                    
                    if (alertGroup) {
                        // alert가 있는 경우
                        iconSrc = ALERT_ICON_MAP[alertGroup];
                        iconAlt = dayData.alertType || '경보';
                        textContent = alertGroup;
                        dayCell.classList.add('alert-active');
                    } else {
                        // alert가 없는 경우 - weather status 표시
                        iconSrc = WEATHER_ICON_MAP[dayData.weather];
                        // status_name만 표시
                        textContent = dayData.weather || '';
                    }
                    
                    dayCell.innerHTML = `
                        <div class="day-number ${dayData.isHoliday ? 'holiday-text' : ''}">${dayData.day}</div>
                        <div class="weather-icon">
                            <img src="${iconSrc}" alt="${iconAlt}" class="weather-image">
                        </div>
                        ${textContent ? `<div class="temp-text"><span>${textContent}</span></div>` : ''}
                    `;

                    dayCell.addEventListener('click', () => {
                        if (activeDayCell && activeDayCell !== dayCell) {
                            activeDayCell.classList.remove('is-active');
                        }
                        activeDayCell = dayCell;
                        dayCell.classList.add('is-active');

                        handleDaySelection(dayData, { region_code: regionCodeForContext, year, month });
                    });

                    daysGrid.appendChild(dayCell);
                });
            });

            if (!daysGrid.querySelector('.day-cell.is-active')) {
                const firstClickable = daysGrid.querySelector('.day-cell.clickable');
                if (firstClickable) {
                    firstClickable.classList.add('is-active');
                    activeDayCell = firstClickable;
                }
            }
        }
    </script>
</body>
</html>
