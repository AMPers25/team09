<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날씨 달력</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 상단 네비게이션 바 -->
    <div class="top-nav">
        <div class="nav-left">
            <button class="home-btn">🏠</button>
            <div class="search-bar">
                <span>검색</span>
                <span class="dropdown-icon">▼</span>
            </div>
        </div>
        <div class="nav-right">
            <button class="nav-tab active" data-tab="temperature">기온</button>
            <button class="nav-tab" data-tab="precipitation">강수량</button>
            <button class="nav-tab" data-tab="alerts">경보특보</button>
        </div>
    </div>
    <!-- 메인 콘텐츠 -->
    <div class="main-content">
        <!-- 왼쪽 통계 패널 -->
        <div class="stats-panel">
            <div class="stat-section">
                <div class="stat-label">월평균</div>
                <div class="stat-value" id="avgTemp">23°</div>
            </div>
            <div class="stat-section">
                <div class="stat-label">최소/최대</div>
                <div class="stat-value" id="minMaxTemp">17°/27°</div>
            </div>
        </div>

        <!-- 달력 영역 -->
        <div class="calendar-container">
            <!-- 달력 네비게이션 -->
            <div class="secondary-nav">
                <div class="calendar-controls">
                    <span class="year-display">2024년</span>
                    <button class="nav-arrow" onclick="changeMonth(-1)">‹</button>
                    <span class="month-display" id="currentMonthDisplay">9월</span>
                    <button class="nav-arrow" onclick="changeMonth(1)">›</button>
                </div>
            </div>
            <div id="calendar" class="calendar-grid">
                <!-- 달력이 여기에 동적으로 생성됩니다 -->
            </div>
        </div>
    </div>

    <script>
        // 현재 표시할 연도와 월 (연도는 2024년으로 고정)
        const FIXED_YEAR = 2024;
        let currentDate = new Date(FIXED_YEAR, new Date().getMonth(), 1);
        let calendarData = null;
        let currentTab = 'temperature'; // 기온, 강수량, 경보특보

        // 초기화
        document.addEventListener('DOMContentLoaded', function() {
            loadCalendarData();
            setupTabHandlers();
        });

        // 탭 핸들러 설정
        function setupTabHandlers() {
            const tabs = document.querySelectorAll('.nav-tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    tabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentTab = this.dataset.tab;
                    // 탭 변경 시 필요한 로직 추가 가능
                });
            });
        }

        // 달 변경 함수 (연도는 고정, 월만 변경)
        function changeMonth(direction) {
            const currentMonth = currentDate.getMonth();
            let newMonth = currentMonth + direction;
            
            // 월 범위 체크 (0-11)
            if (newMonth < 0) {
                newMonth = 11; // 12월로
            } else if (newMonth > 11) {
                newMonth = 0; // 1월로
            }
            
            currentDate = new Date(FIXED_YEAR, newMonth, 1);
            updateMonthDisplay();
            loadCalendarData();
        }

        // 월 표시 업데이트
        function updateMonthDisplay() {
            const month = currentDate.getMonth() + 1;
            document.getElementById('currentMonthDisplay').textContent = `${month}월`;
        }

        // 달력 데이터 로드 함수 (예시 데이터 사용)
        function loadCalendarData() {
            const year = FIXED_YEAR; // 항상 2024년
            const month = currentDate.getMonth() + 1;

            // 예시 데이터 생성
            calendarData = generateSampleData(year, month);
            renderCalendar();
        }

        // 예시 데이터 생성 함수
        function generateSampleData(year, month) {
            const daysInMonth = new Date(year, month, 0).getDate();
            const days = [];
            const holidays = [13, 14, 15]; // 예시 공휴일 (이미지 참조)
            
            let totalMin = 0, totalMax = 0;
            const weatherTypes = ['맑음', '구름', '흐림', '흐린', '비', '눈'];
            
            for (let day = 1; day <= daysInMonth; day++) {
                const minTemp = Math.floor(Math.random() * 10) + 15;
                const maxTemp = minTemp + Math.floor(Math.random() * 10) + 5;
                totalMin += minTemp;
                totalMax += maxTemp;
                
                days.push({
                    day: day,
                    isHoliday: holidays.includes(day),
                    weather: weatherTypes[Math.floor(Math.random() * weatherTypes.length)],
                    minTemp: minTemp,
                    maxTemp: maxTemp
                });
            }

            return {
                region: '서울',
                year: FIXED_YEAR, // 항상 2024년
                month: month,
                avgMinTemp: Math.round(totalMin / daysInMonth),
                avgMaxTemp: Math.round(totalMax / daysInMonth),
                monthMinTemp: Math.min(...days.map(d => d.minTemp)),
                monthMaxTemp: Math.max(...days.map(d => d.maxTemp)),
                days: days
            };
        }

        // 달력 렌더링 함수
        function renderCalendar() {
            if (!calendarData) return;

            const year = calendarData.year;
            const month = calendarData.month;
            
            // 통계 업데이트
            const avgTemp = Math.round((calendarData.avgMinTemp + calendarData.avgMaxTemp) / 2);
            document.getElementById('avgTemp').textContent = `${avgTemp}°`;
            document.getElementById('minMaxTemp').textContent = `${calendarData.monthMinTemp}°/${calendarData.monthMaxTemp}°`;
            
            updateMonthDisplay();

            // 달력 그리드 생성
            const calendar = document.getElementById('calendar');
            calendar.innerHTML = '';

            // 주 평균 헤더와 요일 헤더
            const weekHeader = document.createElement('div');
            weekHeader.className = 'week-header';
            weekHeader.textContent = '주 평균';
            calendar.appendChild(weekHeader);

            const dayHeaders = ['월', '화', '수', '목', '금', '토', '일'];
            dayHeaders.forEach(day => {
                const header = document.createElement('div');
                header.className = 'day-header';
                header.textContent = day;
                calendar.appendChild(header);
            });

            // 첫 번째 날의 요일 계산 (월요일 = 1)
            const firstDay = new Date(year, month - 1, 1).getDay();
            const firstMonday = firstDay === 0 ? 6 : firstDay - 1; // 일요일을 6으로 변환
            
            // 이전 달의 빈 칸
            for (let i = 0; i < firstMonday; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-cell other-month';
                calendar.appendChild(emptyCell);
            }

            // 날짜 칸 생성
            calendarData.days.forEach(dayData => {
                const dayCell = document.createElement('div');
                dayCell.className = 'day-cell';
                if (dayData.isHoliday) {
                    dayCell.classList.add('holiday');
                }

                // 날씨 타입별 이미지 매핑
                const weatherIcons = {
                    '맑음': './assets/clear.png',
                    '구름': './assets/partly_cloudy.png',
                    '흐림': './assets/mostly_cloudy.png',
                    '흐린': './assets/overcast.png',
                    '비': './assets/rain.png',
                    '눈': './assets/snow.png'
                };

                const weatherImage = weatherIcons[dayData.weather] || './assets/clear.png';

                dayCell.innerHTML = `
                    <div class="day-number ${dayData.isHoliday ? 'holiday-text' : ''}">${dayData.day}</div>
                    <div class="weather-icon">
                        <img src="${weatherImage}" alt="${dayData.weather}" class="weather-image">
                    </div>
                    <div class="temp-text">
                        <span>${dayData.minTemp}°</span>
                        <span>${dayData.maxTemp}°</span>
                    </div>
                `;

                calendar.appendChild(dayCell);
            });

            // 다음 달의 빈 칸
            const totalCells = firstMonday + calendarData.days.length;
            const remainingCells = 42 - totalCells - 1; // 주 평균 헤더 포함
            for (let i = 0; i < remainingCells; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-cell other-month';
                calendar.appendChild(emptyCell);
            }

            document.getElementById('calendar').style.display = 'grid';
        }
    </script>
</body>
</html>
