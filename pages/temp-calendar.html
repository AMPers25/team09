<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날씨 달력</title>
    <link rel="stylesheet" href="../assets/css/calendar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!-- 상단 네비게이션 바 -->
    <div class="top-nav">
        <div class="nav-left">
            <button class="home-btn" aria-label="홈으로 이동"><i class="fa-solid fa-house"></i></button>
            <select id="regionSelector" class="region-selector" aria-label="지역 선택"></select>
            <button id="regionGoBtn" class="region-go-btn" type="button">이동</button>
        </div>
        <div class="nav-right">
            <button class="nav-tab active" data-tab="temperature">기온</button>
            <button class="nav-tab" data-tab="precipitation">강수량</button>
            <button class="nav-tab" data-tab="alerts">경보특보</button>
        </div>
    </div>

    <!-- 메인 콘텐츠 -->
    <div class="main-content">
        <!-- 왼쪽 통계 패널 -->
        <div class="stats-panel">
            <div class="stat-section">
                <div class="stat-label">월평균</div>
                <div class="stat-value" id="avgTemp">--</div>
            </div>
            <div class="stat-section">
                <div class="stat-label">최소/최대</div>
                <div class="stat-value" id="minMaxTemp">--</div>
            </div>
        </div>

        <!-- 달력 영역 -->
        <div class="calendar-container">
            <div class="secondary-nav">
                <div class="calendar-controls">
                    <span class="year-display">2024년</span>
                    <button id="prevMonthBtn" class="nav-arrow" type="button" aria-label="이전 달" onclick="changeMonth(-1)">‹</button>
                    <span class="month-display" id="currentMonthDisplay">9월</span>
                    <button id="nextMonthBtn" class="nav-arrow" type="button" aria-label="다음 달" onclick="changeMonth(1)">›</button>
                </div>
            </div>
            <div class="calendar-content">
                <div class="calendar-main">
                    <div class="day-headers" id="dayHeaders"></div>
                    <div class="days-grid" id="daysGrid"></div>
                </div>
            </div>
        </div>
    </div>


    <script>
        const FIXED_YEAR = 2024;
        const WEATHER_ICON_MAP = {
            '맑음': './icons/clear.png',
            '구름조금': './icons/partly_cloudy.png',
            '구름많음': './icons/mostly_cloudy.png',
            '흐린': './icons/overcast.png',
            '비': './icons/rain.png',
            '눈': './icons/snow.png'
        };


        // URL 파라미터에서 region_code와 month 읽기
        const urlParams = new URLSearchParams(window.location.search);
        const regionCode = urlParams.get('region_code') || '';
        const monthParam = urlParams.get('month');
        const initialMonth = monthParam ? parseInt(monthParam, 10) - 1 : new Date().getMonth();
        
        let currentDate = new Date(FIXED_YEAR, initialMonth, 1);
        let calendarData = null;
        let currentTab = 'temperature';
        let activeDayCell = null;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // region_code가 필수이므로 없으면 에러 (DOMContentLoaded 안에서 체크)
                if (!regionCode) {
                    throw new Error('잘못된 접근: region_code 파라미터가 필요합니다.');
                }
                
                updateMonthDisplay(); // 초기 로드 시 버튼 상태 업데이트
                setupTabHandlers();
                setupHomeButton();
                await loadCalendarData();
            } catch (error) {
                console.error('초기화 중 오류 발생:', error);
                document.body.innerHTML = `<div style="padding: 20px; text-align: center;">
                    <h2>오류가 발생했습니다</h2>
                    <p>${error.message}</p>
                    <p>브라우저 콘솔을 확인하세요.</p>
                </div>`;
            }
        });

        function setupHomeButton() {
            const homeBtn = document.querySelector('.home-btn');
            if (homeBtn) {
                homeBtn.addEventListener('click', () => {
                    window.location.href = '/team09/pages/index.html';
                });
            }
        }

        async function setupRegionSelector() {
            const selector = document.getElementById('regionSelector');
            const goBtn = document.getElementById('regionGoBtn');
            if (!selector || !goBtn) return;

            try {
                // 모든 지역 목록 가져오기
                const response = await fetch('/team09/api/ranking?limit=100', {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`API 응답 오류: ${response.status}`);
                }

                const responseData = await response.json();
                const regions = responseData.data || [];

                // 지역 목록을 드롭다운에 추가
                selector.innerHTML = regions
                    .map(region => `<option value="${region.region_code}">${region.region_name}</option>`)
                    .join('');

                // 현재 선택된 지역 코드 설정
                if (regionCode) {
                    selector.value = regionCode;
                }

                goBtn.addEventListener('click', () => {
                    const selectedCode = selector.value;
                    if (!selectedCode) return;

                    const month = currentDate.getMonth() + 1;
                    const params = new URLSearchParams();
                    params.set('region_code', selectedCode);
                    params.set('month', String(month).padStart(2, '0'));
                    window.location.href = `temp-calendar.html?${params.toString()}`;
                });
            } catch (error) {
                console.error('지역 목록 로드 실패:', error);
                // 에러 발생 시 현재 지역만 표시
                if (regionCode && calendarData && calendarData.region_name) {
                    selector.innerHTML = `<option value="${regionCode}">${calendarData.region_name}</option>`;
                } else if (regionCode) {
                    selector.innerHTML = `<option value="${regionCode}">${regionCode}</option>`;
                }
            }
        }

        function debounce(fn, delay = 150) {
            let timer = null;
            return function (...args) {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        function setupTabHandlers() {
            const tabs = document.querySelectorAll('.nav-tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', function () {
                    const targetTab = this.dataset.tab;
                    
                    // 현재 region_code와 month 유지하면서 해당 캘린더로 이동
                    const month = currentDate.getMonth() + 1;
                    const params = new URLSearchParams();
                    params.set('region_code', regionCode);
                    params.set('month', String(month).padStart(2, '0'));
                    
                    let targetPage = '';
                    if (targetTab === 'temperature') {
                        targetPage = 'temp-calendar.html';
                    } else if (targetTab === 'precipitation') {
                        targetPage = 'rain-calendar.html';
                    } else if (targetTab === 'alerts') {
                        targetPage = 'alert-calendar.html';
                    }
                    
                    const currentPage = window.location.pathname.split('/').pop() || '';
                    if (targetPage && targetPage !== currentPage) {
                        window.location.href = `${targetPage}?${params.toString()}`;
                    } else {
                        // 같은 페이지면 탭만 변경
                        tabs.forEach(t => t.classList.remove('active'));
                        this.classList.add('active');
                        currentTab = targetTab;
                    }
                });
            });
        }

        function changeMonth(direction) {
            const currentMonth = currentDate.getMonth();
            let newMonth = currentMonth + direction;

            // 1월에서 이전 달로 가거나 12월에서 다음 달로 가는 것을 방지
            if (newMonth < 0 || newMonth > 11) {
                return;
            }

            currentDate = new Date(FIXED_YEAR, newMonth, 1);
            
            // URL 업데이트
            const month = newMonth + 1;
            const params = new URLSearchParams();
            params.set('region_code', regionCode);
            params.set('month', String(month).padStart(2, '0'));
            window.history.replaceState({}, '', `${window.location.pathname}?${params.toString()}`);
            
            loadCalendarData();
            updateMonthDisplay();
        }

        function updateMonthDisplay() {
            const month = currentDate.getMonth() + 1;
            document.getElementById('currentMonthDisplay').textContent = `${month}월`;
            
            // 월에 따라 버튼 표시/숨김
            const prevBtn = document.getElementById('prevMonthBtn');
            const nextBtn = document.getElementById('nextMonthBtn');
            
            if (prevBtn) {
                prevBtn.style.display = month === 1 ? 'none' : 'block';
            }
            if (nextBtn) {
                nextBtn.style.display = month === 12 ? 'none' : 'block';
            }
        }

        async function loadCalendarData() {
            const year = FIXED_YEAR;
            const month = currentDate.getMonth() + 1;

            try {
                // 새로운 API 엔드포인트: /api/calendar/temperature/{region_code}/{month}
                const apiUrl = `/team09/api/calendar/temperature/${regionCode}/${month}`;
                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    const errorMessage = errorData.error || errorData.message || `API 응답 오류: ${response.status}`;
                    throw new Error(errorMessage);
                }

                const responseData = await response.json();
                if (!responseData) {
                    throw new Error('API에서 데이터를 받지 못했습니다.');
                }

                // API 응답 형식: {status, message, data}
                const apiData = responseData.data || responseData;
                if (!Array.isArray(apiData)) {
                    throw new Error('API 응답 형식이 올바르지 않습니다.');
                }

                // 프론트엔드 형식으로 변환
                calendarData = transformToCalendarFormat(apiData, year, month);
                renderCalendar();
                setupRegionSelector();
            } catch (error) {
                console.error('API 호출 실패:', error);
                document.body.innerHTML = `<div style="padding: 20px; text-align: center;">
                    <h2>데이터를 불러올 수 없습니다</h2>
                    <p>${error.message}</p>
                    <p>브라우저 콘솔을 확인하세요.</p>
                </div>`;
            }
        }

        function transformToCalendarFormat(apiData, year, month) {
            const days = [];
            let regionName = null;
            let monthAvgTemp = null;
            let monthMinTemp = null;
            let monthMaxTemp = null;

            apiData.forEach((item, index) => {
                // region_name은 모든 항목에서 동일하므로 첫 번째 항목에서만 가져옴
                if (!regionName && item.region_name) {
                    regionName = item.region_name;
                }

                // SQL에서 계산한 월별 집계 값은 첫 번째 항목에서만 가져옴
                if (index === 0) {
                    monthAvgTemp = item.month_avg_temp != null ? parseFloat(item.month_avg_temp) : null;
                    monthMinTemp = item.month_min_temp != null ? parseFloat(item.month_min_temp) : null;
                    monthMaxTemp = item.month_max_temp != null ? parseFloat(item.month_max_temp) : null;
                }

                const dateParts = item.date_id.split('-');
                const day = parseInt(dateParts[2], 10);

                // min_temp와 max_temp를 숫자로 변환 및 유효성 검사
                const minTemp = item.min_temp != null ? parseFloat(item.min_temp) : null;
                const maxTemp = item.max_temp != null ? parseFloat(item.max_temp) : null;

                days.push({
                    day: day,
                    minTemp: minTemp != null && !isNaN(minTemp) ? Math.round(minTemp) : null,
                    maxTemp: maxTemp != null && !isNaN(maxTemp) ? Math.round(maxTemp) : null,
                    weather: item.status_name || '맑음',
                    isHoliday: item.is_holiday == 1 || item.is_holiday === true
                });
            });

            return {
                year: year,
                month: month,
                region_code: regionCode,
                region_name: regionName,
                days: days,
                monthAvgTemp: monthAvgTemp != null && !isNaN(monthAvgTemp) ? Math.round(monthAvgTemp) : null,
                monthMinTemp: monthMinTemp != null && !isNaN(monthMinTemp) ? Math.round(monthMinTemp) : null,
                monthMaxTemp: monthMaxTemp != null && !isNaN(monthMaxTemp) ? Math.round(monthMaxTemp) : null
            };
        }

        function formatDateToISO(year, month, day) {
            const normalizedMonth = String(month).padStart(2, '0');
            const normalizedDay = String(day).padStart(2, '0');
            return `${year}-${normalizedMonth}-${normalizedDay}`;
        }

        function handleDaySelection(dayData, context) {
            const { region_code, year, month } = context;
            if (!region_code || !dayData || !dayData.day) {
                console.error('필수 파라미터가 없습니다.');
                return;
            }

            const dateParam = formatDateToISO(year, month, dayData.day);
            const params = new URLSearchParams({
                region_code: region_code,
                date: dateParam
            });
            
            window.location.href = `day-info.html?${params.toString()}`;
        }

        function renderCalendar() {
            if (!calendarData) return;

            const year = calendarData.year;
            const month = calendarData.month;

            const regionCodeForContext = calendarData.region_code || regionCode;
            
            // SQL에서 계산한 월평균 기온 사용
            const avgTemp = calendarData.monthAvgTemp != null && !isNaN(calendarData.monthAvgTemp) ? calendarData.monthAvgTemp : '--';
            document.getElementById('avgTemp').textContent = `${avgTemp}°`;
            
            // SQL에서 계산한 월최소/월최대 기온 사용
            const minTemp = calendarData.monthMinTemp != null && !isNaN(calendarData.monthMinTemp) ? calendarData.monthMinTemp : '--';
            const maxTemp = calendarData.monthMaxTemp != null && !isNaN(calendarData.monthMaxTemp) ? calendarData.monthMaxTemp : '--';
            document.getElementById('minMaxTemp').textContent = `${minTemp}°/${maxTemp}°`;

            updateMonthDisplay();

            const dayHeadersContainer = document.getElementById('dayHeaders');
            const daysGrid = document.getElementById('daysGrid');

            dayHeadersContainer.innerHTML = '';
            daysGrid.innerHTML = '';

            ['월', '화', '수', '목', '금', '토', '일'].forEach(day => {
                const headerCell = document.createElement('div');
                headerCell.className = 'day-header';
                headerCell.textContent = day;
                dayHeadersContainer.appendChild(headerCell);
            });

            // 첫 번째 날의 요일 계산 (월요일=0, 일요일=6)
            const firstDay = new Date(year, month - 1, 1);
            const startOffset = (firstDay.getDay() + 6) % 7;

            // 빈 셀 추가 (월 시작 전)
            for (let i = 0; i < startOffset; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-cell empty';
                daysGrid.appendChild(emptyCell);
            }

            // 날짜 데이터 렌더링
            calendarData.days.forEach(dayData => {
                const dayCell = document.createElement('div');
                dayCell.className = 'day-cell clickable';

                if (dayData.isHoliday) {
                    dayCell.classList.add('holiday');
                }

                const weatherImage = WEATHER_ICON_MAP[dayData.weather] || WEATHER_ICON_MAP['맑음'];

                dayCell.innerHTML = `
                    <div class="day-number ${dayData.isHoliday ? 'holiday-text' : ''}">${dayData.day}</div>
                    <div class="weather-icon">
                        <img src="${weatherImage}" alt="${dayData.weather}" class="weather-image">
                    </div>
                    <div class="temp-text">
                        <span>${dayData.minTemp}°</span>
                        <span>${dayData.maxTemp}°</span>
                    </div>
                `;

                dayCell.addEventListener('click', () => {
                    if (activeDayCell && activeDayCell !== dayCell) {
                        activeDayCell.classList.remove('is-active');
                    }
                    activeDayCell = dayCell;
                    dayCell.classList.add('is-active');

                    handleDaySelection(dayData, { region_code: regionCodeForContext, year, month });
                });

                daysGrid.appendChild(dayCell);
            });

            // 월 끝의 빈 셀 추가 (7의 배수로 맞추기)
            const totalCells = startOffset + calendarData.days.length;
            const remainingCells = (7 - (totalCells % 7)) % 7;
            for (let i = 0; i < remainingCells; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-cell empty';
                daysGrid.appendChild(emptyCell);
            }

            if (!daysGrid.querySelector('.day-cell.is-active')) {
                const firstClickable = daysGrid.querySelector('.day-cell.clickable');
                if (firstClickable) {
                    firstClickable.classList.add('is-active');
                    activeDayCell = firstClickable;
                }
            }
        }
    </script>
</body>
</html>
